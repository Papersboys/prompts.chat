# Install only after the initial ACME certificate has been issued.
server {
    listen 80;
    server_name prompts.li-family.us;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/prompts-acme;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name prompts.li-family.us;
    ssl_certificate /etc/letsencrypt/live/prompts.li-family.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prompts.li-family.us/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    auth_basic "Li Family Prompts - invitation required";
    auth_basic_user_file /etc/nginx/prompts-users;
    location / {
        proxy_pass http://127.0.0.1:4444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep the outer access credential out of application logs/handlers.
        proxy_set_header Authorization "";
        proxy_read_timeout 90s;
    }
}
